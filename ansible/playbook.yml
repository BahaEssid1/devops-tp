
---
- name: Deploy DevSecOps Portfolio
  hosts: all
  connection: local
  become: true

  tasks:
    - name: Update Ubuntu package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Docker and Docker Compose
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: Start and enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Build and deploy portfolio services
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: /vagrant
      changed_when: true
